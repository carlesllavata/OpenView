# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openview"
version = "0.1.0"
edition = "2021"
description = "Download 360 panoramas and photos from map applications at full resolution, with a viewer, crops and HDRI"
license = "GPL-3.0-or-later"
repository = "https://github.com/carlesllavata/OpenView"
publish = false
build = "build.rs"

[lib]
name = "openview"
path = "src/lib.rs"

[[bin]]
name = "OpenView"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.12"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The image code is far too slow without optimisation, so debug builds and tests optimise it too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
